<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Nik'Os" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nik'Os" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      GitHub Pages cannot send response headers, so the policy travels in the
      document. No third-party scripts: the Supabase client is vendored under
      /vendor and loaded on demand. connect-src lists only the public rate feeds
      and the owner's own Supabase project; nothing else may be contacted.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      base-uri 'none';
      object-src 'none';
      form-action 'none';
      img-src 'self' data:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      script-src 'self';
      connect-src 'self' https://www.cbr-xml-daily.ru https://open.er-api.com https://api.coingecko.com https://iss.moex.com https://finnhub.io https://*.supabase.co wss://*.supabase.co;
    " />

    <title>Nik'Os</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="nikos-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="nikos-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260827-172331" />
  </head>
  <body data-theme="dark">
    <!--
      The page holds no records, no counters and no sample rows. Everything
      visible is rendered from the store, so what you see is what you have.
    -->
    <a class="skip-link" href="#pageHost">Перейти к содержимому</a>

    <div id="app">
      <div class="boot-splash">
        <div class="brand-mark large" aria-hidden="true"><span></span><span></span><span></span></div>
        <p>Nik'Os</p>
      </div>
    </div>

    <noscript>
      <div class="boot-error">
        <h1>Нужен JavaScript</h1>
        <p>Nik'Os работает целиком в вашем браузере и без JavaScript открыться не может.</p>
      </div>
    </noscript>

    <!-- A classic script, deliberately not a module: a syntax error anywhere
         in the module graph stops main.js dead but leaves this running, which
         is the only moment it has anything to do. Loaded first for the same
         reason. -->
    <script src="app/boot-guard.js?v=20260827-172331"></script>
    <script type="module" src="app/main.js?v=20260827-172331"></script>
  </body>
</html>
