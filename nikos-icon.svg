<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nik'Os</title>
  <desc id="desc">Three green signal bars on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a18"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#78a844"/>
      <stop offset="1" stop-color="#cfff82"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="92" fill="none" stroke="#b7f36b" stroke-opacity=".14" stroke-width="4"/>
  <g fill="url(#signal)" filter="url(#glow)" transform="skewX(-10)">
    <rect x="124" y="214" width="66" height="166" rx="27" opacity=".62"/>
    <rect x="223" y="132" width="66" height="248" rx="27" opacity=".86"/>
    <rect x="322" y="181" width="66" height="199" rx="27"/>
  </g>
</svg>
